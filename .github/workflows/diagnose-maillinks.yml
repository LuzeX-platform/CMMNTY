# TIJDELIJK: controleert vanaf internet of de adressen uit de mails bereikbaar zijn.
# Wordt weer verwijderd zodra de oorzaak bekend is.
name: Diagnose maillinks (tijdelijk)
on:
  push:
    branches: [claude/keen-lamport-hehzbg]
    paths: [.github/workflows/diagnose-maillinks.yml]
jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - name: Mailprovider
        run: |
          for h in luzex.nl mail.luzex.nl mg.luzex.nl cmmnty.luzex.nl; do
            echo "== $h"
            for t in MX TXT; do dig +noall +answer "$h" $t || true; done
          done
          for h in _dmarc.luzex.nl s1._domainkey.luzex.nl s2._domainkey.luzex.nl mx._domainkey.luzex.nl pic._domainkey.luzex.nl k1._domainkey.luzex.nl \
                   email.luzex.nl email.mail.luzex.nl links.luzex.nl link.luzex.nl click.luzex.nl track.luzex.nl \
                   s1._domainkey.mail.luzex.nl mx._domainkey.mail.luzex.nl pic._domainkey.mail.luzex.nl k1._domainkey.mail.luzex.nl resend._domainkey.luzex.nl; do
            r=$(dig +noall +answer "$h" ANY; dig +noall +answer "$h" CNAME; dig +noall +answer "$h" TXT)
            [ -n "$r" ] && { echo "== $h"; echo "$r" | sort -u; }
          done
          for n in $(seq 1 20); do :; done
          echo klaar
