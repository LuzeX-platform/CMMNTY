# TIJDELIJK: controleert vanaf internet of de adressen uit de mails bereikbaar zijn.
# Wordt weer verwijderd zodra de oorzaak bekend is.
name: Diagnose maillinks (tijdelijk)
on:
  push:
    branches: [claude/keen-lamport-hehzbg]
    paths: [.github/workflows/diagnose-maillinks.yml]
jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - name: DNS
        run: |
          for h in cmmnty.luzex.nl www.cmmnty.luzex.nl luzex-community.onrender.com email.mg.luzex.nl mg.luzex.nl luzex.nl; do
            echo "== $h"
            dig +noall +answer "$h" A || true
            dig +noall +answer "$h" CNAME || true
          done
          echo "== MX/TXT mg.luzex.nl"; dig +noall +answer mg.luzex.nl MX || true; dig +noall +answer mg.luzex.nl TXT || true
          echo "== NS luzex.nl"; dig +noall +answer luzex.nl NS || true
      - name: HTTP
        run: |
          for u in https://cmmnty.luzex.nl/bevestigen.html http://cmmnty.luzex.nl/ https://luzex-community.onrender.com/bevestigen.html https://luzex-community.onrender.com/wachtwoord-resetten.html http://email.mg.luzex.nl/ https://email.mg.luzex.nl/; do
            echo "== $u"
            curl -sS -o /dev/null --max-time 20 -w "status=%{http_code} redirect=%{redirect_url} ip=%{remote_ip}\n" "$u" || echo "MISLUKT (exit $?)"
          done
          echo "== certificaat cmmnty.luzex.nl"
          echo | timeout 15 openssl s_client -connect cmmnty.luzex.nl:443 -servername cmmnty.luzex.nl 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>/dev/null || echo "geen certificaat opgehaald"
