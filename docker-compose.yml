# Alleen voor lokale ontwikkeling: een PostgreSQL 16 zoals op Render.
#   docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: community
      POSTGRES_PASSWORD: community
      POSTGRES_DB: community
    ports:
      - "5432:5432"
    volumes:
      - community-db:/var/lib/postgresql/data
volumes:
  community-db:
