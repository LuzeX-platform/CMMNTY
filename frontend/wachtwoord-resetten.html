<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nieuw wachtwoord — LuzeX Community</title>
  <meta name="description" content="Nieuw wachtwoord bij de LuzeX Community." />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/site.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-pagina="wachtwoord-resetten">
  <header id="balk"></header>

  <main class="auth-kolom">
    <div class="panel auth-kaart">
      <h1>Nieuw wachtwoord</h1>
      <p class="subtitle">Kies een nieuw wachtwoord van minimaal 8 tekens.</p>
      <form id="formulier" novalidate>
        <label for="wachtwoord">Nieuw wachtwoord</label>
        <input id="wachtwoord" name="wachtwoord" type="password" autocomplete="new-password" minlength="8" required />
        <button type="submit">Opslaan</button>
        <p class="error" id="fout" role="alert"></p>
        <p class="success" id="succes"></p>
      </form>
    </div>
  </main>

  <footer id="voet"></footer>
  <script src="/common.js"></script>
  <script src="/auth.js"></script>
</body>
</html>
