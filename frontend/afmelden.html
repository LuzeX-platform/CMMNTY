<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="manifest" href="/assets/site.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-pagina="afmelden">
  <header id="balk"></header>

  <main class="auth-kolom">

      <h1>Afmelden</h1>

      <p class="auth-voet">Je account en profiel blijven gewoon bestaan. Je kunt je later weer aanmelden in <a href="/dashboard/account.html">je account</a>.</p>
    </div>
  </main>

  <footer id="voet"></footer>
  <script src="/common.js"></script>
  <script src="/auth.js"></script>
</body>
</html>
