<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mijn profiel — LuzeX CMMNTY</title>
  <meta name="description" content="Mijn profiel" />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/site.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body data-pagina="profiel">
  <header id="balk"></header>

  <main class="kolom kolom-smal">
    <div class="pagina-kop">
      <p class="kicker">Mijn CMMNTY</p>
      <h1 id="kop">Mijn profiel</h1>
    </div>
    <nav class="tabs" aria-label="Mijn CMMNTY">
      <a href="/dashboard/">Mijn artikelen</a>
      <a href="/dashboard/profiel.html" class="actief" aria-current="page">Mijn profiel</a>
      <a href="/dashboard/account.html">Account</a>
    </nav>
    <form class="panel" id="formulier" novalidate>
      <h2>Directory-profiel</h2>
      <p class="subtitle">Zo zien collega's en verwijzers je in de <a href="/directory.html">directory</a>. Gratis reclame voor je praktijk.</p>

      <label class="vinkje"><input id="gepubliceerd" type="checkbox" /> Mijn profiel is zichtbaar in de directory</label>

      <div class="veld-rij">
        <div>
          <label for="weergavenaam">Naam</label>
          <input id="weergavenaam" type="text" maxlength="120" required />
        </div>
        <div>
          <label for="praktijknaam">Praktijknaam</label>
          <input id="praktijknaam" type="text" maxlength="120" />
        </div>
      </div>

      <label>Specialisme(n) <span style="font-weight:400">— maximaal 5</span></label>
      <div class="chips" id="specialismen"></div>

      <label for="regio">Regio</label>
      <select id="regio"><option value="">Kies een regio</option></select>

      <div class="veld-rij">
        <div>
          <label for="telefoon">Telefoonnummer</label>
          <input id="telefoon" type="tel" maxlength="30" autocomplete="tel" />
        </div>
        <div>
          <label for="contactEmail">E-mail voor contact</label>
          <input id="contactEmail" type="email" maxlength="200" />
        </div>
      </div>

      <label for="website">Website</label>
      <input id="website" type="url" maxlength="200" placeholder="www.jouwpraktijk.nl" />

      <label for="bio">Korte bio</label>
      <textarea id="bio" rows="3" maxlength="250" placeholder="Wat doe je, en voor wie?"></textarea>
      <p class="veld-hint"><span id="bio-teller">0</span>/250 tekens</p>

      <div class="formulier-acties">
        <button type="submit">Opslaan</button>
        <a class="text-link" href="/directory.html" target="_blank">Bekijk de directory ↗</a>
      </div>
      <p class="error" id="fout" role="alert"></p>
      <p class="success" id="succes"></p>
    </form>
  </main>

  <footer id="voet"></footer>
  <script src="/common.js"></script>
  <script src="/dashboard/dashboard.js"></script>
</body>
</html>
