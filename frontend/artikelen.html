<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Artikelen — LuzeX Community</title>
  <meta name="description" content="Alle artikelen over zorginnovatie: gratis en Pro." />
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="manifest" href="/assets/site.webmanifest" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header id="balk"></header>

  <main class="kolom">
    <div class="pagina-kop">
      <p class="kicker">Artikelen</p>
      <h1>Praktisch. Kort. Zonder jargon.</h1>
      <p class="lead">Over AI, tools, privacy en praktijkvoering — steeds met de vraag: wat heb jij eraan?</p>
    </div>

    <form class="filters" id="filters">
      <div class="segment" role="group" aria-label="Toegang">
        <button type="button" data-toegang="" aria-pressed="true">Alles</button>
        <button type="button" data-toegang="gratis" aria-pressed="false">Gratis</button>
        <button type="button" data-toegang="pro" aria-pressed="false">Pro</button>
      </div>
      <div class="filter">
        <label for="categorie">Categorie</label>
        <select id="categorie"><option value="">Alle categorieën</option></select>
      </div>
      <div class="filter">
        <label for="zoek">Zoeken</label>
        <input id="zoek" type="search" placeholder="Bijv. AI, AVG, agenda…" />
      </div>
    </form>

    <div class="kaarten" id="artikelen"><p class="leeg">Artikelen laden…</p></div>
    <nav class="paginering" id="paginering" aria-label="Paginering"></nav>
  </main>

  <footer id="voet"></footer>
  <script src="/common.js"></script>
  <script src="/artikelen.js"></script>
</body>
</html>
